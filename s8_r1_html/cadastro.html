<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        h1 {
           
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        
        legend {
            font-weight: bold;
            color: #333333;
            padding: 0 8px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555555;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #1a73e8;
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        button {
            color: rgb(140, 225, 130);
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.2s;
        }
       
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro de Clientes</h1>

        <form action="#" method="POST">
            
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria Oliveira" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="maria.oliveira@email.com" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(19) 98765-4321" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Ex: Americana" required>
                </div>
            </fieldset>

            <!-- Dados Complementares -->
            <fieldset>
                <legend>Dados Complementares</legend>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" placeholder="Insira aqui informações adicionais sobre o cliente..."></textarea>
                </div>
            </fieldset>

            <button type="submit">Cadastrar Cliente</button>
            
        </form>
    </div>

</body>
</html>
