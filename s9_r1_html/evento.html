<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Evento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
       
        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        .campo {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333333;
            font-size: 14px;
        }
        .obrigatorio {
            color: #e74c3c;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: #27ae60;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Inscrição no Evento</h1>

        <form action="#" method="POST">
            
            <div class="campo">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Gabriel Alves" required>
            </div>

            <div class="campo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>
                <input type="email" id="email" name="email" placeholder="gabriel.alves@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone <span class="obrigatorio">*</span></label>
                <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999" pattern="[0-9()\s-]{10,15}" required>
            </div>

            <div class="campo">
                <label for="data">Data do Evento <span class="obrigatorio">*</span></label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="campo">
                <label for="participantes">Quantidade de Participantes <span class="obrigatorio">*</span></label>
                <input type="number" id="participantes" name="participantes" min="1" max="100" placeholder="Ex: 1" required>
            </div>

            <div class="campo">
                <label for="observacoes">Observações / Restrições Alimentares</label>
                <textarea id="observacoes" name="observacoes" rows="4" placeholder="Informe aqui."></textarea>
            </div>

            <button type="submit">Confirmar Inscrição</button>
            
        </form>
    </div>

</body>
</html>
