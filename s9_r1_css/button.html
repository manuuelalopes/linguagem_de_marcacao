<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2 - Botões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 15px;
            padding: 40px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #2563eb;
            cursor: pointer;
            border-radius: 5px;
            /* Requisito: Todos com transition de 0.5s */
            transition: 0.5s;
        }

        /* Botão 1: Altera background */
        .btn-1 {
            background-color: #ffffff;
            color: #2563eb;
        }
        .btn-1:hover {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* Botão 2: Altera color */
        .btn-2 {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-2:hover {
            color: #facc15; /* Muda para amarelo */
        }

        /* Botão 3: Aplica transform: scale(1.1) */
        .btn-3 {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-3:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <button class="btn-1">Botão 1 (Background)</button>
    <button class="btn-2">Botão 2 (Color)</button>
    <button class="btn-3">Botão 3 (Scale)</button>

</body>
</html>
